# SandTree dependency policy (NFR-E03/E04, DD-SECOPS §10)
#
# Mirrors `schemas/deny.toml` from the approved design baseline and adds the
# advisory / binary-source rules the release gate needs. cargo-deny reads this
# file from the workspace root.

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MIT-0",
    "BSL-1.0",
    "MPL-2.0",
]
# Public-domain / unknown-licensed deps must be reviewed explicitly before release.
allow-private = { ignore = false }

[[licenses.exceptions]]
crate = "ring"
allow = ["MIT"]
reason = "transitive of rustls; MIT"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# rustls is pulled by reqwest (bollard TLS). Both are Apache-2.0/MIT/ISC.
deny = [
    { name = "openssl", reason = "NFR-E03: avoid dual OpenSSL linkage on Windows" },
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []