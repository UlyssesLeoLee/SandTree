[package]
name = "sandtree-provider-mcp-remote"
description = "MCP endpoint provider: obtains sandbox-internal state over JSON-RPC/HTTP when penetration is not permitted (ADR-015, FR-0xx v1.2)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
sandtree-model.workspace = true
sandtree-observation-model.workspace = true
sandtree-policy.workspace = true
sandtree-sdk.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
# `ring` rather than `aws-lc-rs`: the latter needs cmake at build time.
# `rustls-native-certs` uses the host trust store, which is what a private CA
# installed on the operator's machine looks like.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "native-tokio", "rustls-native-certs"] }
http-body-util = "0.1"
bytes = "1"
tokio = { workspace = true, features = ["sync", "time", "net"] }

[dev-dependencies]
hyper = { version = "1", features = ["server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }