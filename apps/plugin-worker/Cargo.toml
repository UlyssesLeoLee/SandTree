[package]
name = "sandtree-plugin-worker"
description = "Plugin worker: one plugin generation per process, explicit limits, no store access (DD-PLG §10, FR-055)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "sandtree_plugin_worker"
path = "src/lib.rs"

[dependencies]
blake3.workspace = true
sandtree-model.workspace = true
sandtree-plugin-host.workspace = true
sandtree-sdk.workspace = true
serde_json.workspace = true
wasmtime = { workspace = true, optional = true }

[features]
default = []
wasmtime-abi = ["dep:wasmtime", "sandtree-plugin-host/wasmtime-abi"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
