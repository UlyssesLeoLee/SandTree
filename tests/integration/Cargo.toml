[package]
name = "sandtree-integration-tests"
description = "SandTree integration tests: cross-crate flows over fakes (NFR-O04, NFR-P01/P04)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true


[dependencies]
sandtree-daemon.workspace = true
sandtree-event.workspace = true
sandtree-ipc.workspace = true
sandtree-kernel.workspace = true
sandtree-model.workspace = true
sandtree-observation-core.workspace = true
sandtree-observation-model.workspace = true
sandtree-plugin-host.workspace = true
sandtree-policy.workspace = true
sandtree-sdk.workspace = true
sandtree-store.workspace = true
sandtree-vfs.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# Mock crates: a test-only fake that serves the same ports a real provider does,
# so cross-crate flows can be driven with no Docker daemon, Multipass or
# Windows Sandbox present. `crates/*` must never depend on these.
sandtree-mock-runtime.workspace = true
sandtree-mock-observation.workspace = true
