[package]
name = "sandtree-mock-wasm-components"
description = "SandTree mock: hand-written WAT component fixtures for the plugin host ABI (FR-054, ADR-004)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Fixture data only. No product crate may depend on this one (mock/README.md).
# serde itself is required, not just serde_json: the manifest and the
# expectations it checks are derived types, so the derive macros and the
# container attributes are part of the crate's surface, not an implementation
# detail of the JSON calls.
serde = { workspace = true }
serde_json.workspace = true
# Host-target wasmtime, feature-gated. It is never needed to *store* or *read* a
# fixture; it is only what lets a test compile the WAT and assert the result
# against a real engine. Off by default because the crate's whole reason to
# exist is to be usable on a machine that cannot build guest wasm at all.
wasmtime = { workspace = true, optional = true }
# `compile()` turns WAT text into component *binary*, which is what a host
# loads. Handing text to wasmtime hides that conversion; producing the bytes
# explicitly is the point. Gated with wasmtime so the default build stays small.
wat = { version = "1", optional = true }

[dev-dependencies]
# The end-to-end binding check drives the *product* adapter over these
# fixtures, so it depends on the product crates. The dependency direction is
# mock -> product; no product crate may depend on this one (mock/README.md).
sandtree-model.workspace = true
sandtree-sdk.workspace = true
sandtree-plugin-host = { workspace = true, features = ["wasmtime-abi"] }
# The worker is the other half of the plugin path: `tests/worker_loading.rs`
# drives `Worker::load` over this fixture, which is the only way to prove the
# worker half actually stages a component rather than only compiling.
sandtree-plugin-worker = { workspace = true, features = ["wasmtime-abi"] }
# The daemon's control plane plus its staging loader. `tests/daemon_install.rs`
# drives `plugin.install` over this fixture, which is the only place the whole
# path — package on disk -> verify -> load -> publish -> route -> swap — is
# exercised as one thing.
sandtree-daemon = { workspace = true, features = ["in-process-worker"] }
# Unconditional, unlike the `engine` feature above: the binding tests must run
# in the ordinary `cargo test --workspace` gate, not only under a flag.
wasmtime = { workspace = true, features = ["wat"] }
wat = "1"
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile.workspace = true

[features]
default = []
engine = ["dep:wasmtime", "dep:wat"]