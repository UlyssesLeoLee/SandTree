name: SandTree CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: fmt / clippy / test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (MSVC)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

  license:
    name: license / advisory / source gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + cargo-deny
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny --all-features check licenses bans sources advisories

      - name: generate SBOM (SPDX)
        shell: pwsh
        run: |
          cargo install cargo-about --locked
          cargo about generate spdx > sbom.spdx.json
          cargo about generate about.json > sbom.about.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.about.json